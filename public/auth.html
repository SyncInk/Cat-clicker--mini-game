<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Clicker — Sign In</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-deep:    #050508;
      --text:       #f0f4f8;
      --muted:      #a0aec0;
      --cyan:       #00f0ff;
      --gold:       #ffb800;
      --rose:       #ff2a6d;
      --card-bg:    rgba(15, 12, 30, 0.4);
      --card-border: rgba(255, 255, 255, 0.15);
      --input-bg:   rgba(255, 255, 255, 0.05);
      --input-border: rgba(255, 255, 255, 0.10);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 10% 20%, #1a0b2e 0%, #0d0e15 40%, #050508 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Background Kitties Animation ──────────────────── */
    .bg-kitties {
      position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    
    .kitty {
      position: absolute; font-size: 64px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
      opacity: 0.3;
    }

    /* Lurking Kitty */
    .kitty-lurk {
      bottom: -20px; left: 10%;
      animation: lurk 8s infinite;
    }
    @keyframes lurk {
      0%, 20% { transform: translateY(50px); opacity: 0; }
      40%, 60% { transform: translateY(0px); opacity: 0.5; }
      80%, 100% { transform: translateY(50px); opacity: 0; }
    }

    /* Sleeping Kitty */
    .kitty-sleep {
      top: 20%; right: 15%;
      animation: sleep 4s infinite alternate;
    }
    @keyframes sleep {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Eating/Walking Kitty */
    .kitty-walk {
      bottom: 20%; right: -100px;
      animation: walk 20s linear infinite;
    }
    @keyframes walk {
      0% { transform: translateX(0) scaleX(-1); }
      100% { transform: translateX(-120vw) scaleX(-1); }
    }

    /* ── ambient glow orbs ────────────────────────────── */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.18; z-index: 0; pointer-events: none;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    .orb--cyan  { width: 420px; height: 420px; background: var(--cyan); top: -10%; left: -8%; }
    .orb--gold  { width: 340px; height: 340px; background: var(--gold); bottom: -12%; right: -6%; animation-delay: -4s; }
    .orb--rose  { width: 260px; height: 260px; background: var(--rose); top: 50%; left: 60%; animation-delay: -8s; opacity: 0.10; }

    @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, -20px) scale(1.12); } }

    /* ── Layout & Card ─────────────────────────────────── */
    .page { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

    .card {
      width: 100%; max-width: 420px; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 24px; padding: 40px 32px 36px;
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset, 0 8px 32px rgba(0, 0, 0, 0.4);
      opacity: 0; transform: translateY(28px) scale(0.97);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }

    @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ── Brand ─────────────────────────────────────────── */
    .brand { text-align: center; margin-bottom: 28px; }
    .sigil {
      display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px;
      border-radius: 16px; background: linear-gradient(135deg, var(--cyan), var(--gold)); color: #0d0e15;
      font-weight: 800; font-size: 28px; margin-bottom: 14px; box-shadow: 0 4px 24px rgba(0, 240, 255, 0.25);
    }
    .brand h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--text) 30%, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand p { font-size: 13px; color: var(--muted); margin-top: 4px; text-transform: uppercase; font-weight: 500; }

    /* ── Tabs ──────────────────────────────────────────── */
    .tabs { display: flex; background: rgba(255,255,255,0.04); border-radius: 14px; padding: 4px; margin-bottom: 26px; position: relative; }
    .tabs .slider { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); border-radius: 11px; background: linear-gradient(135deg, var(--cyan), var(--gold)); transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1); z-index: 0; }
    .tabs.signup .slider { transform: translateX(100%); }
    .tab-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 600; border: none; background: none; color: var(--muted); cursor: pointer; position: relative; z-index: 1; transition: color 0.3s; }
    .tab-btn.active { color: #0d0e15; }

    /* ── Form ──────────────────────────────────────────── */
    .form-group { margin-bottom: 16px; max-height: 72px; opacity: 1; overflow: hidden; transition: all 0.4s ease; }
    .form-group.hidden { max-height: 0; opacity: 0; margin-bottom: 0; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-group input { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px; color: var(--text); font-size: 15px; outline: none; transition: all 0.3s; }
    .form-group input:focus { border-color: rgba(0, 240, 255, 0.45); background: rgba(0, 240, 255, 0.03); box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.08); }

    /* ── Error ─────────────────────────────────────────── */
    .error-msg { font-size: 13px; color: var(--rose); margin-bottom: 14px; opacity: 0; transition: opacity 0.3s; }
    .error-msg.visible { opacity: 1; }

    /* ── Buttons ───────────────────────────────────────── */
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--text); color: var(--bg-deep);
      font-size: 15px; font-weight: 700; cursor: pointer; position: relative; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-submit:hover { transform: scale(0.98); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
    .btn-submit:active { transform: scale(0.95); }

    .divider { display: flex; align-items: center; text-align: center; margin: 24px 0; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--card-border); }
    .divider span { padding: 0 10px; }

    .footer-note { text-align: center; margin-top: 24px; font-size: 12px; color: var(--muted); }

    /* ── Loading Screen Overlay ────────────────────────── */
    #loadingOverlay {
      position: fixed; inset: 0; background: rgba(10, 7, 16, 0.95); backdrop-filter: blur(20px);
      z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.5s;
    }
    #loadingOverlay.active { opacity: 1; pointer-events: auto; }
    .loader-cat { font-size: 80px; animation: loaderBounce 1s infinite alternate; margin-bottom: 20px; }
    .loader-bar { width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .loader-progress { width: 0%; height: 100%; background: var(--cyan); animation: loaderFill 2s infinite ease-in-out; }
    
    @keyframes loaderBounce { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
    @keyframes loaderFill { 0% { width: 0%; transform: translateX(0); } 50% { width: 100%; transform: translateX(0); } 100% { width: 100%; transform: translateX(200px); } }

  </style>
</head>
<body>

  <!-- Background Kitties -->
  <div class="bg-kitties">
    <div class="kitty kitty-lurk">🐈</div>
    <div class="kitty kitty-sleep">💤 🐈</div>
    <div class="kitty kitty-walk">🐈</div>
  </div>

  <div class="orb orb--cyan"></div>
  <div class="orb orb--gold"></div>
  <div class="orb orb--rose"></div>

  <!-- Loading Screen -->
  <div id="loadingOverlay">
    <div class="loader-cat">😸</div>
    <div style="font-family: var(--font-header); font-size: 24px; font-weight: 700; margin-bottom: 15px; background: linear-gradient(135deg, var(--text) 30%, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent;">Loading Universe...</div>
    <div class="loader-bar"><div class="loader-progress"></div></div>
  </div>

  <!-- Main content -->
  <div class="page">
    <div class="card" id="authCard">
      <div class="brand">
        <div class="sigil">🐾</div>
        <h1>Feline Ascendancy</h1>
        <p>Premium Desktop Adventure</p>
      </div>

      <div class="tabs" id="tabs">
        <div class="slider"></div>
        <button class="tab-btn active" data-mode="login" type="button">Sign In</button>
        <button class="tab-btn" data-mode="signup" type="button">Sign Up</button>
      </div>

      <form id="authForm" novalidate>
        <div class="form-group hidden" id="nameGroup">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" placeholder="Your awesome name" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" autocomplete="current-password" required />
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider"><span>or</span></div>
      <div id="googleBtn" style="display:flex; justify-content:center;"></div>

      <div class="footer-note">&copy; 2026 Feline Ascendancy &middot; meow-powered</div>
    </div>
  </div>

  <script>
    const tabs = document.getElementById('tabs');
    const tabBtns = tabs.querySelectorAll('.tab-btn');
    const nameGroup = document.getElementById('nameGroup');
    const form = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const errorEl = document.getElementById('errorMsg');
    const loadingOverlay = document.getElementById('loadingOverlay');

    let mode = 'login'; // 'login' | 'signup'

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const newMode = btn.dataset.mode;
        if (newMode === mode) return;
        mode = newMode;
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (mode === 'signup') {
          tabs.classList.add('signup');
          nameGroup.classList.remove('hidden');
          btnText.textContent = 'Create Account';
          document.getElementById('password').autocomplete = 'new-password';
        } else {
          tabs.classList.remove('signup');
          nameGroup.classList.add('hidden');
          btnText.textContent = 'Sign In';
          document.getElementById('password').autocomplete = 'current-password';
        }
        hideError();
      });
    });

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }
    function hideError() {
      errorEl.classList.remove('visible');
      errorEl.textContent = '';
    }
    
    function triggerLoading() {
      loadingOverlay.classList.add('active');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value.trim();

      if (!email) return showError('Please enter your email.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Enter a valid email address.');
      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (mode === 'signup' && !displayName) return showError('Please enter a display name.');

      submitBtn.disabled = true;

      try {
        const endpoint = mode === 'signup' ? '/api/signup' : '/api/login';
        const body = mode === 'signup' ? { username: email, password, displayName } : { username: email, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || result.message || 'Something went wrong.');

        localStorage.setItem('catClickerToken', result.token);
        localStorage.setItem('catClickerProfile', JSON.stringify(result.profile));

        triggerLoading();
        setTimeout(() => window.location.href = '/index.html', 1500);
      } catch (err) {
        showError(err.message || 'Network error. Please try again.');
        submitBtn.disabled = false;
      }
    });

    function handleCredentialResponse(response) {
      if (!response.credential) return showError('Google sign in failed');
      submitBtn.disabled = true;
      
      fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential })
      })
      .then(res => res.json().then(data => ({ ok: res.ok, body: data })))
      .then(({ ok, body }) => {
        if (!ok) throw new Error(body.error || 'Google sign in failed');
        localStorage.setItem('catClickerToken', body.token);
        localStorage.setItem('catClickerProfile', JSON.stringify(body.profile));
        
        triggerLoading();
        setTimeout(() => window.location.href = '/index.html', 1500);
      })
      .catch(err => {
        showError(err.message);
        submitBtn.disabled = false;
      });
    }

    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "381684954560-05h9kgiof2jqja4i94t4c31o7omn3ue0.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });
      google.accounts.id.renderButton(
        document.getElementById("googleBtn"),
        { theme: "filled_black", size: "large", width: 356, text: "continue_with", shape: "rectangular" }
      );
    };
  </script>
</body>
</html>
