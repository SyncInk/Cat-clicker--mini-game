<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Clicker — Sign In</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-deep:    #050508;
      --bg-mid:     #0d0e15;
      --bg-top:     #1a0b2e;
      --text:       #f0f4f8;
      --muted:      #a0aec0;
      --cyan:       #00f0ff;
      --gold:       #ffb800;
      --rose:       #ff2a6d;
      --card-bg:    rgba(15, 12, 30, 0.55);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg:   rgba(255, 255, 255, 0.04);
      --input-border: rgba(255, 255, 255, 0.10);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 10% 20%, #1a0b2e 0%, #0d0e15 40%, #050508 100%);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Animated Dot Grid Background ──────────────────── */
    canvas#dotGrid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ambient glow orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    .orb--cyan  { width: 420px; height: 420px; background: var(--cyan); top: -10%; left: -8%; }
    .orb--gold  { width: 340px; height: 340px; background: var(--gold); bottom: -12%; right: -6%; animation-delay: -4s; }
    .orb--rose  { width: 260px; height: 260px; background: var(--rose); top: 50%; left: 60%; animation-delay: -8s; opacity: 0.10; }

    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.12); }
    }

    /* ── Layout ────────────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* ── Card ──────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px 32px 36px;
      backdrop-filter: blur(32px) saturate(1.4);
      -webkit-backdrop-filter: blur(32px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 2px 40px rgba(0, 0, 0, 0.55),
        0 0 120px -40px rgba(0, 240, 255, 0.08);
      opacity: 0;
      transform: translateY(28px) scale(0.97);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Brand ─────────────────────────────────────────── */
    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .sigil {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      color: #0d0e15;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
      box-shadow: 0 4px 24px rgba(0, 240, 255, 0.25), 0 2px 8px rgba(255, 184, 0, 0.18);
      position: relative;
      animation: sigilPulse 3s ease-in-out infinite;
    }

    @keyframes sigilPulse {
      0%, 100% { box-shadow: 0 4px 24px rgba(0,240,255,0.25), 0 2px 8px rgba(255,184,0,0.18); }
      50%      { box-shadow: 0 4px 36px rgba(0,240,255,0.40), 0 2px 12px rgba(255,184,0,0.30); }
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, var(--text) 30%, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Tabs ──────────────────────────────────────────── */
    .tabs {
      display: flex;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 26px;
      position: relative;
    }

    .tabs .slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      border-radius: 11px;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
      box-shadow: 0 2px 12px rgba(0,240,255,0.18);
    }

    .tabs.signup .slider {
      transform: translateX(100%);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: color 0.3s;
      border-radius: 11px;
    }

    .tab-btn.active {
      color: #0d0e15;
    }

    /* ── Form ──────────────────────────────────────────── */
    .form-group {
      margin-bottom: 16px;
      max-height: 72px;
      opacity: 1;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.3s ease,
                  margin-bottom 0.4s ease;
    }

    .form-group.hidden {
      max-height: 0;
      opacity: 0;
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

    .form-group input::placeholder {
      color: rgba(160, 174, 192, 0.45);
    }

    .form-group input:focus {
      border-color: rgba(0, 240, 255, 0.45);
      background: rgba(0, 240, 255, 0.03);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.08), 0 0 20px -6px rgba(0, 240, 255, 0.15);
    }

    /* ── Error ─────────────────────────────────────────── */
    .error-msg {
      font-size: 13px;
      color: var(--rose);
      margin-bottom: 14px;
      min-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s, min-height 0.3s;
      text-align: center;
      font-weight: 500;
    }

    .error-msg.visible {
      opacity: 1;
      min-height: 20px;
    }

    /* ── Submit Button ─────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), var(--gold));
      color: #0d0e15;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.2), 0 2px 8px rgba(255, 184, 0, 0.12);
    }

    .btn-submit::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(0, 240, 255, 0.32), 0 2px 10px rgba(255, 184, 0, 0.20);
    }

    .btn-submit:hover::before { opacity: 1; }

    .btn-submit:active {
      transform: translateY(0) scale(0.985);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    /* loading spinner inside button */
    .btn-submit .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(13, 14, 21, 0.3);
      border-top-color: #0d0e15;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin: 0 auto;
    }

    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner  { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ───────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--input-border), transparent);
    }

    .divider span {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* ── Google Button ─────────────────────────────────── */
    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px 20px;
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-google:hover {
      background: #232340;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 24px -6px rgba(0, 240, 255, 0.10);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0) scale(0.985);
    }

    /* ── Misc ──────────────────────────────────────────── */
    ::selection {
      background: rgba(0, 240, 255, 0.25);
      color: #fff;
    }

    /* subtle scanline overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    /* Footer */
    .footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 11.5px;
      color: rgba(160, 174, 192, 0.45);
      letter-spacing: 0.3px;
    }

    .footer-note a {
      color: var(--cyan);
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .footer-note a:hover { opacity: 1; }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 32px 22px 28px; border-radius: 20px; }
      .sigil { width: 48px; height: 48px; font-size: 19px; border-radius: 14px; }
      .brand h1 { font-size: 21px; }
    }
  </style>
</head>
<body>

  <!-- Ambient glow orbs -->
  <div class="orb orb--cyan"></div>
  <div class="orb orb--gold"></div>
  <div class="orb orb--rose"></div>

  <!-- Dot grid canvas -->
  <canvas id="dotGrid"></canvas>

  <!-- Scanline overlay -->
  <div class="scanlines"></div>

  <!-- Main content -->
  <div class="page">
    <div class="card" id="authCard">

      <!-- Brand -->
      <div class="brand">
        <div class="sigil">CC</div>
        <h1>Cat Clicker</h1>
        <p>Premium Desktop Adventure</p>
      </div>

      <!-- Tabs -->
      <div class="tabs" id="tabs">
        <div class="slider"></div>
        <button class="tab-btn active" data-mode="login" type="button">Sign In</button>
        <button class="tab-btn" data-mode="signup" type="button">Sign Up</button>
      </div>

      <!-- Form -->
      <form id="authForm" novalidate>
        <!-- Display Name (signup only) -->
        <div class="form-group hidden" id="nameGroup">
          <label for="displayName">Display Name</label>
          <input type="text" id="displayName" placeholder="Your awesome name" autocomplete="name" />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 8 characters" minlength="8" autocomplete="current-password" required />
        </div>

        <!-- Error -->
        <div class="error-msg" id="errorMsg"></div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner"></div>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider"><span>or</span></div>

      <!-- Google button -->
      <button type="button" class="btn-google" id="googleBtn">
        <svg viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59a14.5 14.5 0 0 1 0-9.18l-7.98-6.19a24.0 24.0 0 0 0 0 21.56l7.98-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Continue with Google
      </button>

      <div class="footer-note">
        &copy; 2026 Cat Clicker &middot; meow-powered
      </div>

    </div>
  </div>

  <script>
    /* ── Dot Grid Animation ──────────────────────────── */
    (function initDotGrid() {
      const canvas = document.getElementById('dotGrid');
      const ctx = canvas.getContext('2d');
      let w, h, cols, rows;
      const spacing = 38;
      const dotBase = 0.8;
      let mouse = { x: -1000, y: -1000 };
      let time = 0;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        cols = Math.ceil(w / spacing) + 1;
        rows = Math.ceil(h / spacing) + 1;
      }

      window.addEventListener('resize', resize);
      resize();

      document.addEventListener('mousemove', e => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      function draw() {
        ctx.clearRect(0, 0, w, h);
        time += 0.004;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * spacing;
            const y = r * spacing;
            const dx = mouse.x - x;
            const dy = mouse.y - y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const influence = Math.max(0, 1 - dist / 180);

            const wave = Math.sin(time + c * 0.15 + r * 0.12) * 0.3 + 0.5;
            const alpha = 0.04 + wave * 0.04 + influence * 0.35;
            const radius = dotBase + influence * 1.8;

            // colour: cyan tint near mouse, otherwise subtle grey
            const g = Math.round(200 + influence * 55);
            const b = Math.round(210 + influence * 45);
            ctx.fillStyle = `rgba(${Math.round(150 + influence * 100)}, ${g}, ${b}, ${alpha})`;

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── Auth Logic ──────────────────────────────────── */
    const tabs      = document.getElementById('tabs');
    const tabBtns   = tabs.querySelectorAll('.tab-btn');
    const nameGroup = document.getElementById('nameGroup');
    const form      = document.getElementById('authForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText   = submitBtn.querySelector('.btn-text');
    const errorEl   = document.getElementById('errorMsg');
    const googleBtn = document.getElementById('googleBtn');

    let mode = 'login'; // 'login' | 'signup'

    /* Tab switching */
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const newMode = btn.dataset.mode;
        if (newMode === mode) return;
        mode = newMode;

        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (mode === 'signup') {
          tabs.classList.add('signup');
          nameGroup.classList.remove('hidden');
          btnText.textContent = 'Create Account';
          document.getElementById('password').autocomplete = 'new-password';
        } else {
          tabs.classList.remove('signup');
          nameGroup.classList.add('hidden');
          btnText.textContent = 'Sign In';
          document.getElementById('password').autocomplete = 'current-password';
        }

        hideError();
      });
    });

    /* Error helpers */
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }
    function hideError() {
      errorEl.classList.remove('visible');
      errorEl.textContent = '';
    }

    /* Form submit */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value.trim();

      // Basic validation
      if (!email) return showError('Please enter your email.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Enter a valid email address.');
      if (password.length < 8) return showError('Password must be at least 8 characters.');
      if (mode === 'signup' && !displayName) return showError('Please enter a display name.');

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const endpoint = mode === 'signup' ? '/api/signup' : '/api/login';
        const body = mode === 'signup'
          ? { username: email, password, displayName }
          : { username: email, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const result = await res.json();

        if (!res.ok) {
          throw new Error(result.error || result.message || 'Something went wrong.');
        }

        // Store auth data
        localStorage.setItem('catClickerToken', result.token);
        localStorage.setItem('catClickerProfile', JSON.stringify(result.profile));

        // Redirect
        window.location.href = '/index.html';

      } catch (err) {
        showError(err.message || 'Network error. Please try again.');
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });

    /* Google placeholder */
    googleBtn.addEventListener('click', () => {
      alert('Google login coming soon');
    });
  </script>
</body>
</html>
