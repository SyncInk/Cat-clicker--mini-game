<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feline Ascendancy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=DM+Sans:opsz,wght@9..40,400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0a0710;
      --bg-day: #1a2b4c;
      --bg-afternoon: #361f4b;
      --bg-night: #0a0710;
      
      --accent-purple: #b48cff;
      --accent-gold: #f5c842;
      --accent-cyan: #6bffee;
      --accent-pink: #ff8cda;
      
      --panel-bg: rgba(15, 10, 25, 0.7);
      --panel-border: rgba(180, 140, 255, 0.15);
      
      --font-header: 'Cinzel Decorative', cursive;
      --font-body: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(180,140,255,0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(180,140,255,0.6); }

    body {
      background-color: var(--bg-color);
      color: white;
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      transition: background-color 5s ease;
      display: grid;
      grid-template-columns: 320px 1fr 380px;
    }

    #environment {
      position: absolute; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(circle at 50% 100%, rgba(180, 140, 255, 0.15), transparent 60%);
    }
    #star-field {
      position: absolute; inset: -50px; opacity: 0.6;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0));
      background-size: 200px 200px;
      animation: parallaxStars 150s linear infinite;
    }
    @keyframes parallaxStars { from { transform: translateY(0); } to { transform: translateY(-200px); } }

    .col {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      z-index: 10;
    }

    #col-left {
      background: linear-gradient(to right, rgba(10,7,16,0.95), rgba(10,7,16,0.5));
      border-right: 1px solid var(--panel-border);
      backdrop-filter: blur(15px);
      padding: 20px;
      gap: 20px;
    }

    #col-right {
      background: linear-gradient(to left, rgba(10,7,16,0.95), rgba(10,7,16,0.5));
      border-left: 1px solid var(--panel-border);
      backdrop-filter: blur(15px);
      padding: 0;
    }

    #col-center {
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 5;
    }

    .panel-section {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .panel-section.flex-grow { flex-grow: 1; overflow-y: auto; }
    
    .panel-title {
      font-family: var(--font-header);
      color: var(--accent-gold);
      font-size: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    
    .panel-subtitle { font-size: 12px; font-family: var(--font-body); color: var(--accent-purple); text-transform: uppercase; letter-spacing: 1px; }

    /* Right Column Specifics */
    .shop-header {
      padding: 20px 20px 0 20px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
    }
    .shop-tabs { display: flex; gap: 10px; margin-bottom: -1px; }
    .shop-tab { padding: 12px 20px; cursor: pointer; font-family: var(--font-header); color: var(--muted); border-bottom: 2px solid transparent; transition: opacity 0.2s; }
    .shop-tab.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }

    .shop-list { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

    .upgrade-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .upgrade-item:hover { background: rgba(255,255,255,0.08); transform: translateX(-4px); }
    .upgrade-item.affordable { border-left: 4px solid var(--accent-gold); }
    .upgrade-item.affordable:hover { background: rgba(245,200,66,0.1); }
    .upgrade-item.locked { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

    /* Center Stage */
    #hud-top {
      position: absolute; top: 30px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .main-currency {
      font-family: var(--font-header); font-size: 64px; font-weight: 900;
      color: white; text-shadow: 0 4px 20px rgba(245,200,66,0.5), 2px 4px 0 #000;
      display: flex; align-items: center; gap: 16px; pointer-events: auto;
    }
    .gem-currency { font-family: var(--font-header); font-size: 24px; color: var(--accent-cyan); text-shadow: 0 2px 10px rgba(107,255,238,0.5), 1px 2px 0 #000; }
    
    .status-row { display: flex; gap: 12px; pointer-events: auto; }
    .status-pill {
      background: rgba(0,0,0,0.6); border: 1px solid var(--panel-border); border-radius: 20px;
      padding: 4px 12px; font-size: 12px; font-weight: 700; color: var(--accent-purple);
      backdrop-filter: blur(4px); cursor: default; display: flex; align-items: center; gap: 6px;
    }

    /* The Cat */
    #cat-stage {
      position: relative; width: 400px; height: 400px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transform-origin: bottom center;
    }
    #cat-image {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 0 30px rgba(180,140,255,0.4));
      animation: breathe 4s ease-in-out infinite;
      transition: filter 0.5s, transform 0.05s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 2;
    }
    /* Squash and Stretch */
    #cat-stage:active #cat-image { transform: scaleY(0.9) scaleX(1.1) translateY(10px); }
    
    .pedestal-glow {
      position: absolute; bottom: 20px; width: 300px; height: 60px; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(180,140,255,0.6) 0%, transparent 70%);
      transform: scaleY(0.5); z-index: 1;
    }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.02) scaleX(0.98); } }

    /* Particles */
    #particle-layer { position: absolute; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
    .dmg-text {
      position: absolute; font-family: var(--font-header); font-weight: 900; font-size: 28px;
      color: white; text-shadow: 0 0 10px var(--accent-gold), 2px 2px 0 #000;
      animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .dmg-text.crit { color: var(--accent-pink); font-size: 40px; text-shadow: 0 0 20px var(--accent-pink), 2px 2px 0 #000; }
    .coin-particle {
      position: absolute; width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent-gold); box-shadow: 0 0 15px var(--accent-gold);
      animation: arc 0.8s cubic-bezier(0.2, 0.8, 0.4, 1) forwards;
    }
    @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { transform: translateY(-30px) scale(1.2); opacity: 1; } 100% { transform: translateY(-150px) scale(1); opacity: 0; } }
    @keyframes arc { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }

    /* Buttons */
    .btn {
      background: linear-gradient(135deg, var(--accent-purple), #8a4fff);
      border: 1px solid rgba(255,255,255,0.2); color: white; font-family: var(--font-body);
      font-weight: 700; padding: 10px 16px; border-radius: 8px; cursor: pointer; transition: opacity 0.2s, transform 0.2s;
      text-transform: uppercase; letter-spacing: 1px; width: 100%;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(180,140,255,0.4); }
    .btn:active { transform: translateY(1px); }
    .btn-gold { background: linear-gradient(135deg, var(--accent-gold), #f57f17); color: #4e342e; }
    .btn-outline { background: transparent; border-color: var(--panel-border); color: var(--muted); }

    /* Leaderboard Podium CSS */
    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 8px; position: relative; overflow: hidden; }
    .rank-1 { background: rgba(255, 215, 0, 0.1); border: 1px solid #FFD700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2) inset; }
    .rank-1 .player-name { background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C); -webkit-background-clip: text; color: transparent; font-weight: 900; font-size: 16px; }
    .rank-1 .crown { position: absolute; left: 16px; top: -8px; width: 24px; animation: bob 2s infinite ease-in-out; }
    
    .rank-2 { background: rgba(192, 192, 192, 0.05); border: 1px solid #C0C0C0; }
    .rank-2::after { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); animation: shimmer 3s infinite linear; }
    .rank-2 .player-name { background: linear-gradient(to right, #8e9eab, #eef2f3); -webkit-background-clip: text; color: transparent; font-weight: 800; }
    
    .rank-3 { background: rgba(205, 127, 50, 0.05); border: 1px solid #cd7f32; box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(205, 127, 50, 0.2); }
    .rank-3 .player-name { background: linear-gradient(to right, #cd7f32, #f5deb3, #8b4513); -webkit-background-clip: text; color: transparent; font-weight: 800; }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes shimmer { 100% { left: 200%; } }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; padding: 32px; width: 400px; text-align: center; transform: scale(0.9); transition: transform 0.3s; }
    .modal-overlay.active .modal-content { transform: scale(1); }
  </style>
</head>
<body>
  <script>if(!localStorage.getItem('catClickerToken')) window.location.replace('/auth.html');</script>

  <div id="environment"><div id="star-field"></div></div>
  <div id="particle-layer"></div>

  <!-- Left Column -->
  <div id="col-left" class="col">
    <!-- Time Machine -->
    <div class="panel-section">
      <div class="panel-title">Time Machine <span class="panel-subtitle">Saves</span></div>
      <div id="history-list" style="max-height: 150px; overflow-y: auto;">
        <div style="color:var(--muted); font-size:12px; text-align:center; padding:10px;">Loading timeline...</div>
      </div>
      <div style="font-size:10px; color:var(--muted); text-align:center; margin-top:4px;" id="save-status">Syncing to cloud...</div>
    </div>

    <!-- Leaderboard -->
    <div class="panel-section flex-grow">
      <div class="panel-title">Galactic Ranks <span class="panel-subtitle">Top 10</span></div>
      <div id="leaderboard-list" style="display:flex; flex-direction:column; gap:4px; flex-grow:1; overflow-y:auto; padding-top: 10px;"></div>
      <div id="leaderboard-me" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);"></div>
    </div>
  </div>

  <!-- Center Column -->
  <div id="col-center" class="col">
    <div id="hud-top">
      <div class="main-currency"><img src="/assets/tier3.png" style="width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 0 10px #f5c842);" onerror="this.style.display='none'"/> <span id="hud-coins">0</span></div>
      <div class="gem-currency">💎 <span id="hud-gems">0</span></div>
      <div class="status-row">
        <div class="status-pill" id="badge-streak">🔥 Day 1</div>
        <div class="status-pill" id="badge-mood">😸 Happy</div>
        <div class="status-pill" id="badge-prestige" style="display:none; color:var(--accent-gold); border-color:var(--accent-gold);">✨ 0 Meta</div>
      </div>
    </div>

    <div id="cat-stage">
      <div class="pedestal-glow" id="cat-pedestal"></div>
      <img src="/assets/tier1.png" id="cat-image" alt="Cat"/>
    </div>
  </div>

  <!-- Right Column -->
  <div id="col-right" class="col">
    <div class="shop-header">
      <div class="shop-tabs">
        <div class="shop-tab active">Store</div>
      </div>
    </div>
    
    <div class="shop-list" id="upgrades-list"></div>

    <div style="padding:20px; border-top:1px solid var(--panel-border); background:rgba(0,0,0,0.3); display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline" id="btn-toggle-music" onclick="audio.toggleMusic()">🎵 Music: ON</button>
        <button class="btn btn-outline" id="btn-toggle-sfx" onclick="audio.toggleSfx()">🔊 SFX: ON</button>
      </div>
      <button class="btn btn-gold" id="btn-prestige" onclick="game.prestige()" style="display:none;">✨ ASCEND (Prestige)</button>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline" onclick="game.logout()">Sign Out</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="offline-modal">
    <div class="modal-content">
      <h2 style="font-family:var(--font-header); color:var(--accent-gold); margin-bottom:10px; font-size:32px;">Welcome Back!</h2>
      <p style="color:var(--muted); margin-bottom:30px;">Your cats farmed cosmic energy offline!</p>
      <div style="font-family:var(--font-header); font-size:40px; color:var(--accent-cyan); margin-bottom:10px;" id="offline-coins">+0</div>
      <button class="btn btn-cyan" onclick="document.getElementById('offline-modal').classList.remove('active')">Collect</button>
    </div>
  </div>
<script>
/**
 * INFINITE INCREMENTAL GAME - MONOLITHIC LOGIC
 * Phase 2: BigInt Mathematics & State Management
 * Phase 3: Procedural Web Audio ADSR Synthesizer
 */

// --- UTILS ---
function formatBigInt(val) {
  if (typeof val !== 'bigint') val = BigInt(val || 0);
  if (val < 1000n) return val.toString();
  
  const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi"];
  let numStr = val.toString();
  let length = numStr.length;
  let suffixIndex = Math.floor((length - 1) / 3);
  
  if (suffixIndex < suffixes.length) {
    let remainder = length % 3;
    if (remainder === 0) remainder = 3;
    let main = numStr.substring(0, remainder);
    let decimal = numStr.substring(remainder, remainder + 2);
    return `${main}.${decimal}${suffixes[suffixIndex]}`;
  } else {
    // Scientific Notation or Bracket notation for massive numbers
    let exponent = length - 1;
    let main = numStr[0];
    let decimal = numStr.substring(1, 3);
    return `${main}.${decimal}e${exponent}`;
  }
}

// --- API ---
const API = {
  getToken: () => localStorage.getItem('catClickerToken'),
  headers: () => ({
    'Authorization': 'Bearer ' + localStorage.getItem('catClickerToken'),
    'Content-Type': 'application/json'
  }),
  async save(gameState, reason = 'autosave') {
    if (!this.getToken()) return;
    try {
      await fetch('/api/save', { method: 'POST', headers: this.headers(), body: JSON.stringify({ save: gameState, reason }) });
    } catch(e) { console.error('Save failed', e); }
  },
  async load() {
    const res = await fetch('/api/save', { headers: this.headers() });
    if (!res.ok) {
      if (res.status === 401) { localStorage.removeItem('catClickerToken'); window.location.replace('/auth.html'); }
      throw new Error('Failed to load save');
    }
    return res.json();
  },
  async leaderboard() {
    const res = await fetch('/api/leaderboard', { headers: this.headers() });
    return res.ok ? res.json() : { leaderboard: [] };
  },
  async restore(id) {
    const res = await fetch('/api/history/' + id, { method: 'POST', headers: this.headers() });
    if (res.ok) window.location.reload();
  },
  async logout() {
    await fetch('/api/logout', { method: 'POST', headers: this.headers() });
    localStorage.removeItem('catClickerToken');
    window.location.replace('/auth.html');
  }
};

// --- PROCEDURAL AUDIO ---
const audio = {
  ctx: null, masterGain: null,
  musicTimer: null, musicStep: 0,
  settings: { music: true, sfx: true },
  nextNoteTime: 0,
  
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.3;
      this.masterGain.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  
  playADSR(freq, type='square', attack=0.01, decay=0.1, sustain=0, release=0.1, vol=0.1) {
    if (!this.settings.sfx && type !== 'music') return;
    if (!this.settings.music && type === 'music') return;
    this.init();
    
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const env = this.ctx.createGain();
    
    osc.type = type === 'music' ? 'square' : type;
    osc.frequency.setValueAtTime(freq, t);
    
    // ADSR Envelope
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(vol, t + attack);
    env.gain.exponentialRampToValueAtTime(Math.max(0.001, sustain), t + attack + decay);
    
    osc.connect(env);
    env.connect(this.masterGain);
    
    osc.start(t);
    
    const stopTime = t + attack + decay + release;
    env.gain.exponentialRampToValueAtTime(0.0001, stopTime);
    osc.stop(stopTime + 0.1);
  },

  playSweep(startFreq, endFreq, dur) {
    if (!this.settings.sfx) return;
    this.init();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const env = this.ctx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(startFreq, t);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.1, t + 0.02);
    env.gain.exponentialRampToValueAtTime(0.001, t + dur);
    
    osc.connect(env);
    env.connect(this.masterGain);
    osc.start(t);
    osc.stop(t + dur);
  },

  click(isCrit) {
    if (isCrit) this.playSweep(1200, 400, 0.3);
    else this.playSweep(800, 1600, 0.1);
  },

  buy() { this.playADSR(880, 'square', 0.05, 0.1, 0, 0.1, 0.2); },
  
  // Algorithmic Sequencer
  scheduler() {
    if (!this.settings.music) return;
    while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
      this.scheduleNote();
      this.nextNoteTime += 0.25; // 16th notes
    }
    this.musicTimer = requestAnimationFrame(() => this.scheduler());
  },
  
  scheduleNote() {
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C Major Pentatonic
    
    // Bassline
    if (this.musicStep % 4 === 0) {
      const root = scale[0] / 2;
      this.playADSR(root, 'music', 0.05, 0.2, 0, 0.1, 0.2);
    }
    
    // Arpeggiator (dynamic layers based on passive income)
    if (game.state.passiveIncome > 0n && this.musicStep % 2 === 0) {
      const note = scale[Math.floor(Math.random() * scale.length)];
      this.playADSR(note, 'music', 0.02, 0.1, 0, 0.1, 0.05);
    }
    
    // High layer (late game)
    if (game.state.passiveIncome > 1000n && Math.random() < 0.3) {
      const highNote = scale[Math.floor(Math.random() * scale.length)] * 2;
      this.playADSR(highNote, 'music', 0.01, 0.05, 0, 0.1, 0.03);
    }
    
    this.musicStep++;
  },

  startMusic() {
    if (!this.settings.music) return;
    this.init();
    if (!this.musicTimer) {
      this.nextNoteTime = this.ctx.currentTime + 0.1;
      this.scheduler();
    }
  },

  toggleMusic() {
    this.settings.music = !this.settings.music;
    document.getElementById('btn-toggle-music').textContent = this.settings.music ? '🎵 Music: ON' : '🎵 Music: OFF';
    if (!this.settings.music) {
      cancelAnimationFrame(this.musicTimer);
      this.musicTimer = null;
    } else {
      this.startMusic();
    }
    game.autoSave();
  },

  toggleSfx() {
    this.settings.sfx = !this.settings.sfx;
    document.getElementById('btn-toggle-sfx').textContent = this.settings.sfx ? '🔊 SFX: ON' : '🔊 SFX: OFF';
    game.autoSave();
  }
};

// --- GAME LOGIC ---
const game = {
  state: {
    coins: 0n, gems: 0n, totalCoins: 0n, clickPower: 1n, passiveIncome: 0n,
    prestigeMultiplier: 100n, // Base 100 for 1.00x
    prestigeCurrency: 0n,
    tier: 1, streak: 1, lastLogin: Date.now(),
    upgrades: {}
  },
  historyData: [],
  
  shop: [
    { id: 't1', name: 'Tails (Common)', baseCost: 50n, cps: 1n, multiplier: 1.15, icon: '🐁' },
    { id: 't2', name: 'Spot (Common)', baseCost: 250n, cps: 5n, multiplier: 1.15, icon: '🧶' },
    { id: 't3', name: 'Blinx (Uncommon)', baseCost: 1500n, cps: 35n, multiplier: 1.15, icon: '🐈' },
    { id: 't4', name: 'Meowth (Uncommon)', baseCost: 10000n, cps: 200n, multiplier: 1.12, icon: '🪙' },
    { id: 't5', name: 'Incineroar (Rare)', baseCost: 500000n, cps: 8500n, multiplier: 1.10, icon: '🔥' },
    { id: 't6', name: 'Jolteon (Epic)', baseCost: 10000000n, cps: 150000n, multiplier: 1.08, icon: '⚡' },
    { id: 't7', name: 'Kratos (Legendary)', baseCost: 1000000000n, cps: 10000000n, multiplier: 1.07, icon: '⚔️' },
    { id: 'click1', name: 'Sharpen Claws', baseCost: 100n, click: 1n, multiplier: 1.5, icon: '🐾' },
    { id: 'click2', name: 'Laser Pointer', baseCost: 5000n, click: 50n, multiplier: 1.4, icon: '🔴' }
  ],

  init(savedData, history) {
    if (savedData?.player) {
      this.state.coins = BigInt(savedData.currency?.coins || 0);
      this.state.gems = BigInt(savedData.currency?.gems || 0);
      this.state.totalCoins = BigInt(savedData.stats?.totalCoinsEarned || savedData.currency?.coins || 0);
      this.state.upgrades = savedData.upgrades || {};
      this.state.streak = savedData.stats?.streak || 1;
      this.state.lastLogin = savedData.meta?.lastSavedAt ? Date.parse(savedData.meta.lastSavedAt) : Date.now();
      this.state.tier = savedData.player?.tier || 1;
      
      // Prestige comes from the server summary natively, but we calc it here to display it
      const prevMeta = BigInt(savedData.stats?.metaCurrency || 0);
      this.state.prestigeCurrency = prevMeta;
      this.state.prestigeMultiplier = 100n + (prevMeta * 5n); // Each point = 5% bonus
    }
    this.historyData = history || [];
    
    this.recalculateStats();
    this.processOffline();
    
    document.getElementById('cat-stage').addEventListener('pointerdown', (e) => this.clickCat(e));
    
    setInterval(() => this.tick(), 1000);
    setInterval(() => this.autoSave(), 30000);
    
    ui.renderShop();
    ui.updateHud();
    ui.fetchLeaderboard();
  },

  recalculateStats() {
    let passive = 0n, click = 1n;
    this.shop.forEach(item => {
      const count = BigInt(this.state.upgrades[item.id] || 0);
      if (item.cps) passive += count * item.cps;
      if (item.click) click += count * item.click;
    });
    
    // Apply prestige multiplier (Base 100)
    this.state.passiveIncome = (passive * this.state.prestigeMultiplier) / 100n;
    this.state.clickPower = (click * this.state.prestigeMultiplier) / 100n;
  },

  calcCost(baseCost, multiplier, count) {
    // Exponential calculation for BigInt
    return baseCost * BigInt(Math.floor(Math.pow(multiplier, count)));
  },

  clickCat(e) {
    const isCrit = Math.random() < 0.1;
    let amount = this.state.clickPower;
    if (isCrit) amount *= 3n;
    
    this.state.coins += amount;
    this.state.totalCoins += amount;
    
    audio.click(isCrit);
    ui.spawnParticles(e.clientX, e.clientY, amount, isCrit);
    
    this.checkEvolution();
    ui.updateHud();
    ui.renderShop(); // Update affordability
  },

  buy(id) {
    const item = this.shop.find(i => i.id === id);
    const count = this.state.upgrades[id] || 0;
    const cost = this.calcCost(item.baseCost, item.multiplier, count);
    
    if (this.state.coins >= cost) {
      this.state.coins -= cost;
      this.state.upgrades[id] = count + 1;
      this.recalculateStats();
      ui.renderShop();
      ui.updateHud();
      audio.buy();
    }
  },

  checkEvolution() {
    let newTier = 1;
    if (this.state.totalCoins >= 1000000000n) newTier = 4;
    else if (this.state.totalCoins >= 1000000n) newTier = 3;
    else if (this.state.totalCoins >= 10000n) newTier = 2;
    
    if (newTier > this.state.tier) {
      this.state.tier = newTier;
      document.getElementById('cat-image').src = `/assets/tier${newTier}.png`;
    }
  },

  tick() {
    if (this.state.passiveIncome > 0n) {
      this.state.coins += this.state.passiveIncome;
      this.state.totalCoins += this.state.passiveIncome;
      ui.updateHud();
      ui.renderShop();
    }
  },

  processOffline() {
    const now = Date.now();
    const diffHours = (now - this.state.lastLogin) / (1000 * 60 * 60);
    if (diffHours > 1 && this.state.passiveIncome > 0n) {
      const effectiveHours = Math.min(24, diffHours);
      const earned = BigInt(Math.floor(effectiveHours * 3600)) * this.state.passiveIncome;
      this.state.coins += earned;
      this.state.totalCoins += earned;
      
      document.getElementById('offline-coins').textContent = '+' + formatBigInt(earned);
      document.getElementById('offline-modal').classList.add('active');
    }
    this.state.lastLogin = now;
  },

  prestige() {
    // Requires minimum 1 Trillion lifetime coins
    if (this.state.totalCoins < 1000000000000n) {
      alert("You need at least 1 Trillion coins to ascend!");
      return;
    }
    
    const metaGained = BigInt(Math.floor(Math.pow(Number(this.state.totalCoins) / 1000000, 0.35)));
    
    if (confirm(`Ascend to a higher plane? You will gain ${metaGained} Meta Currency, resetting all coins and units.`)) {
      this.state.prestigeCurrency += metaGained;
      this.state.coins = 0n;
      this.state.totalCoins = 0n;
      this.state.upgrades = {};
      this.state.tier = 1;
      this.recalculateStats();
      this.checkEvolution();
      ui.renderShop();
      ui.updateHud();
      this.autoSave('manual');
    }
  },

  autoSave(reason='autosave') {
    const sts = document.getElementById('save-status');
    if(sts) sts.textContent = 'Syncing to cloud...';
    const payload = {
      meta: { lastSavedAt: new Date().toISOString() },
      player: { tier: this.state.tier },
      currency: { coins: this.state.coins.toString(), gems: this.state.gems.toString() },
      stats: { totalCoinsEarned: this.state.totalCoins.toString(), streak: this.state.streak, metaCurrency: this.state.prestigeCurrency.toString() },
      upgrades: this.state.upgrades
    };
    API.save(payload, reason).then(() => {
      if(sts) sts.textContent = 'Saved just now';
    });
  },
  
  restore(id) {
    if (confirm('Restore this point in time? Current progress will be lost!')) {
      API.restore(id);
    }
  },

  logout() {
    this.autoSave('manual');
    API.logout();
  }
};

// --- UI LOGIC ---
const ui = {
  updateHud() {
    document.getElementById('hud-coins').textContent = formatBigInt(game.state.coins);
    document.getElementById('hud-gems').textContent = formatBigInt(game.state.gems);
    
    const pb = document.getElementById('badge-prestige');
    if (game.state.prestigeCurrency > 0n) {
      pb.style.display = 'flex';
      pb.textContent = `✨ ${game.state.prestigeCurrency} Meta`;
    }
    
    const btnPrestige = document.getElementById('btn-prestige');
    if (game.state.totalCoins > 1000000000000n) {
      btnPrestige.style.display = 'block';
    }
  },

  renderShop() {
    const list = document.getElementById('upgrades-list');
    list.innerHTML = '';
    game.shop.forEach(item => {
      const count = game.state.upgrades[item.id] || 0;
      const cost = game.calcCost(item.baseCost, item.multiplier, count);
      const canAfford = game.state.coins >= cost;
      
      const row = document.createElement('div');
      row.className = `upgrade-item ${canAfford ? 'affordable' : 'locked'}`;
      row.onclick = () => { if(canAfford) game.buy(item.id); };
      
      const effectTxt = item.cps ? `+${formatBigInt(item.cps)}/sec` : `+${formatBigInt(item.click)}/click`;
      
      row.innerHTML = `
        <div style="font-size:32px;">${item.icon}</div>
        <div style="flex-grow:1;">
          <div style="font-family:var(--font-header); color:var(--accent-gold); font-size:16px;">${item.name}</div>
          <div style="font-size:11px; color:var(--muted);">${effectTxt}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:14px; font-weight:700;">C ${formatBigInt(cost)}</div>
          <div style="font-size:11px; color:var(--accent-purple);">Lvl ${count}</div>
        </div>
      `;
      list.appendChild(row);
    });
  },

  async fetchLeaderboard() {
    const data = await API.leaderboard();
    const list = document.getElementById('leaderboard-list');
    list.innerHTML = '';
    if (!data.leaderboard || !data.leaderboard.length) {
      list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted);">No rank data</div>';
      return;
    }
    
    data.leaderboard.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = `list-row rank-${i + 1}`;
      if (i > 2) row.className = 'list-row'; // Normal style for >3
      
      let crownHtml = '';
      if (i === 0) {
        crownHtml = `<svg class="crown" viewBox="0 0 24 24" fill="#FFD700"><path d="M5 16L3 5L8.5 10L12 2L15.5 10L21 5L19 16H5Z"/></svg>`;
      }
      
      // We parse the string back, although server summary might just provide Number strings.
      // If server provides strings for massive scores, formatBigInt handles it natively since we cast BigInt
      row.innerHTML = `
        ${crownHtml}
        <div style="display:flex; align-items:center; gap:8px; z-index:2;">
          <div style="width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900;">${i+1}</div>
          <div class="player-name">${p.displayName || p.username}</div>
        </div>
        <div style="font-family:var(--font-header); font-size:14px; z-index:2;">${formatBigInt(BigInt(p.score || 0))}</div>
      `;
      list.appendChild(row);
    });
  },

  spawnParticles(x, y, amount, isCrit) {
    const layer = document.getElementById('particle-layer');
    const txt = document.createElement('div');
    txt.className = `dmg-text ${isCrit ? 'crit' : ''}`;
    txt.textContent = isCrit ? `CRIT! +${formatBigInt(amount)}` : `+${formatBigInt(amount)}`;
    txt.style.left = (x + (Math.random()*40-20)) + 'px';
    txt.style.top = (y - 30) + 'px';
    layer.appendChild(txt);
    setTimeout(() => txt.remove(), 1000);
    
    const num = isCrit ? 6 : 2;
    for(let i=0; i<num; i++) {
      const p = document.createElement('div');
      p.className = 'coin-particle';
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--tx', (Math.random()*200 - 100) + 'px');
      p.style.setProperty('--ty', (Math.random()*-200 - 50) + 'px');
      layer.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
  }
};

window.onload = async () => {
  try {
    const data = await API.load();
    if (data.save?.settings) {
      audio.settings.music = data.save.settings.music ?? true;
      audio.settings.sfx = data.save.settings.sound ?? true;
    }
    document.getElementById('btn-toggle-music').textContent = audio.settings.music ? '🎵 Music: ON' : '🎵 Music: OFF';
    document.getElementById('btn-toggle-sfx').textContent = audio.settings.sfx ? '🔊 SFX: ON' : '🔊 SFX: OFF';
    if (audio.settings.music) {
      document.addEventListener('click', () => audio.startMusic(), { once: true });
    }
    
    game.init(data.save, data.history);
  } catch(e) {
    console.error("Boot failed", e);
  }
};
</script>
